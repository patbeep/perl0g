name: Build Perlog IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS app
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -project Perlog.xcodeproj -scheme Perlog -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' build
      - name: Package IPA for Sideloadly
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/Perlog.app"
          test -d "$APP"
          rm -rf build/Payload build/Perlog-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/Perlog.app
          cd build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Perlog-unsigned.ipa
          test -s Perlog-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Perlog-IPA-for-Sideloadly
          path: build/Perlog-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
