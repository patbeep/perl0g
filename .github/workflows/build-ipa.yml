name: Build Perlog IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: |
          set -euxo pipefail
          xcodegen generate
          test -f Perlog.xcodeproj/project.pbxproj

      - name: Build unsigned device app
        run: |
          set -euxo pipefail
          rm -rf build
          xcodebuild \
            -project Perlog.xcodeproj \
            -scheme Perlog \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build

      - name: Verify iPhone app bundle
        run: |
          set -euxo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/Perlog.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/Perlog"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"
          file "$APP/Perlog"

      - name: Create standard Sideloadly IPA
        run: |
          set -euxo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/Perlog.app"
          rm -rf ipa-output
          mkdir -p ipa-output/Payload
          cp -R "$APP" ipa-output/Payload/Perlog.app
          cd ipa-output
          /usr/bin/zip -qry Perlog-Sideloadly.ipa Payload
          test -s Perlog-Sideloadly.ipa
          /usr/bin/unzip -t Perlog-Sideloadly.ipa
          /usr/bin/shasum -a 256 Perlog-Sideloadly.ipa > Perlog-Sideloadly.ipa.sha256
          echo "Created: $PWD/Perlog-Sideloadly.ipa"
          /usr/bin/unzip -l Perlog-Sideloadly.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Perlog-Sideloadly-IPA
          path: ipa-output/Perlog-Sideloadly.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: Perlog-Sideloadly-IPA-SHA256
          path: ipa-output/Perlog-Sideloadly.ipa.sha256
          if-no-files-found: error
          retention-days: 30
