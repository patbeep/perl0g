name: Perlog
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.perlog.app
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Perlog:
    type: application
    platform: iOS
    sources: [Perlog]
    settings:
      base:
        PRODUCT_NAME: Perlog
        INFOPLIST_KEY_CFBundleDisplayName: Perlog
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Perlog lets you choose photos to add to your personal log."
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
